name: Auto-Update Dashboard

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas matplotlib openpyxl python-dotenv
          
      - name: Run update script
        run: |
          python update_dashboard.py
          
      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          # Check if any generated files changed
          if [ -z "$(git status --porcelain)" ]; then
          echo "No changes to commit"
          exit 0
          fi

          # Stage all new, modified, or deleted files
          git add -A
          git commit -m "🚀 Auto-update dashboard charts and README" || echo "Nothing to commit"

          # Rebase cleanly with autostash and favor remote on conflict
          git fetch origin main
          git rebase origin/main --autostash -X theirs || {
          echo "Rebase failed; aborting"
          git rebase --abort || true
          exit 1
          }
          # Push updated files safely
          git push --force-with-lease origin HEAD:main
